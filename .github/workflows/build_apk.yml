name: Build NMH Karaoke Direct APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Project & Fix Kotlin
        run: |
          flutter create --org com.nmh.karaoke --project-name nmh_karaok_tab .
          mkdir -p assets android/app/src/main/kotlin/com/nmh/karaoke
          cp image_afebac29.jpg assets/logo.jpg || true
          cp custom_src/pubspec.yaml pubspec.yaml
          cp custom_src/android/app/src/main/kotlin/com/nmh/karaoke/MainActivity.kt android/app/src/main/kotlin/com/nmh/karaoke/MainActivity.kt
          cp custom_src/lib/main.dart lib/main.dart
          sed -i 's/setContentView(layout)/setContentView(layout as android.view.View)/g' android/app/src/main/kotlin/com/nmh/karaoke/MainActivity.kt
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\/><application android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: NMH Karaoke v3.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          
