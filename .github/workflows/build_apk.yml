                                    OutlinedButton(
                                      style: OutlinedButton.styleFrom(
                                        foregroundColor: Colors.cyanAccent,
                                        side: const BorderSide(color: Colors.cyanAccent),
                                      ),
                                      onPressed: () => _addToQueue(s, playNow: true),
                                      child: const Text('ချက်ချင်းဖွင့်', style: TextStyle(fontWeight: FontWeight.bold)),
                                    ),
                                  ],
                                ),
                              );
                            },
                          ),
                  ),
                ],
              );
            }

            Widget _themedCard(String title, String cat, IconData icon, List<Color> colors) {
              return InkWell(
                onTap: () => _openCategory(cat),
                borderRadius: BorderRadius.circular(16),
                child: Container(
                  decoration: BoxDecoration(
                    gradient: LinearGradient(colors: colors, begin: Alignment.topLeft, end: Alignment.bottomRight),
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(color: Colors.white24, width: 1.2),
                    boxShadow: [BoxShadow(color: colors.first.withOpacity(0.4), blurRadius: 8, offset: const Offset(0, 4))],
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, size: 46, color: Colors.white),
                      const SizedBox(height: 10),
                      Text(title, style: const TextStyle(fontSize: 17, fontWeight: FontWeight.bold, color: Colors.white)),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NMH-Standalone-Karaoke-APK-v2
          path: build/app/outputs/flutter-apk/app-release.apk
