name: Build NMH Karaoke Direct APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Project & Permissions
        run: |
          flutter create --org com.nmh.karaoke --project-name nmh_karaok_tab .
          sed -i 's/1.7.10/1.9.24/g' android/settings.gradle || true
          sed -i 's/1.8.22/1.9.24/g' android/settings.gradle || true
          sed -i 's/1.7.10/1.9.24/g' android/build.gradle || true
          sed -i 's/1.8.22/1.9.24/g' android/build.gradle || true
          mkdir -p assets android/app/src/main/kotlin/com/nmh/karaoke
          cp image_afebac29.jpg assets/logo.jpg || true
          cp custom_src/pubspec.yaml pubspec.yaml
          cp custom_src/android/app/src/main/kotlin/com/nmh/karaoke/MainActivity.kt android/app/src/main/kotlin/com/nmh/karaoke/MainActivity.kt
          cp custom_src/lib/main.dart lib/main.dart
          sed -i 's/setContentView(layout)/setContentView(layout as android.view.View)/g' android/app/src/main/kotlin/com/nmh/karaoke/MainActivity.kt
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/><uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/><uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\"/><uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\"/>"
          s = s.replace("<application", perms + "<application android:requestLegacyExternalStorage=\"true\"")
          s = s.replace("android:label=\"nmh_karaok_tab\"", "android:label=\"NMH Karaoke Tab\"")
          s = s.replace("adjustResize", "adjustPan")
          open(p, "w").write(s)
          '
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.${{ github.run_number }}
          name: NMH Karaoke v5.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          
