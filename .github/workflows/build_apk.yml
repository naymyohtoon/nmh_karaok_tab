name: Build NMH Karaoke APK v2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Initialize & Configure Flutter Project
        run: |
          flutter create --org com.nmh.karaoke --project-name nmh_karaok_tab .
          sed -i 's/1.7.10/1.9.22/g' android/settings.gradle || true
          sed -i 's/1.8.22/1.9.22/g' android/settings.gradle || true
          sed -i 's/1.7.10/1.9.22/g' android/build.gradle || true
          mkdir -p assets
          if [ -f image_afebac29.jpg ]; then cp image_afebac29.jpg assets/logo.jpg; fi

      - name: Write pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: nmh_karaok_tab
          description: NMH Standalone Offline Dual Screen Karaoke System
          publish_to: 'none'
          version: 2.0.0+2

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            excel: ^4.0.6
            sqflite: ^2.3.3
            path: ^1.9.0
            path_provider: ^2.1.4
            permission_handler: ^11.3.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF
          flutter pub get

      - name: Write AndroidManifest.xml
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:label="NMH Karaoke"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write MainActivity.kt (Dual Screen + Tablet Video + Voice Control)
        run: |
          mkdir -p android/app/src/main/kotlin/com/nmh/karaoke
          cat << 'EOF' > android/app/src/main/kotlin/com/nmh/karaoke/MainActivity.kt
          package com.nmh.karaoke

          import android.app.Presentation
          import android.content.Context
          import android.graphics.Color
          import android.hardware.display.DisplayManager
          import android.media.MediaPlayer
          import android.os.Bundle
          import android.view.Display
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.plugin.common.StandardMessageCodec
          import io.flutter.plugin.platform.PlatformView
          import io.flutter.plugin.platform.PlatformViewFactory
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.nmh.karaoke/player"
              private var displayManager: DisplayManager? = null
              private var presentation: KaraokePresentation? = null
              private var mediaPlayer: MediaPlayer? = null
              private var currentVoiceMode = "STEREO"
              private var methodChannel: MethodChannel? = null
              private var localSurfaceHolder: SurfaceHolder? = null

              private val displayListener = object : DisplayManager.DisplayListener {
                  override fun onDisplayAdded(displayId: Int) {
                      setupSecondaryDisplay()
                  }
                  override fun onDisplayRemoved(displayId: Int) {
                      presentation?.dismiss()
                      presentation = null
                      attachActiveSurface()
                      notifyDisplayStatus(false)
                  }
                  override fun onDisplayChanged(displayId: Int) {}
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  flutterEngine.platformViewsController.registry.registerViewFactory(
                      "nmh_video_surface",
                      object : PlatformViewFactory(StandardMessageCodec.INSTANCE) {
                          override fun create(context: Context, viewId: Int, args: Any?): PlatformView {
                              return LocalVideoView(context)
                          }
                      }
                  )

                  displayManager = getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  displayManager?.registerDisplayListener(displayListener, null)

                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "checkDisplay" -> {
                              val connected = setupSecondaryDisplay()
                              result.success(connected)
                          }
                          "playVideo" -> {
                              val path = call.argument<String>("path")
                              if (path != null) {
                                  playVideo(path)
                                  result.success(true)
                              } else {
                                  result.error("INVALID_PATH", "Video path is null", null)
                              }
                          }
                          "pauseResume" -> {
                              result.success(togglePauseResume())
                          }
                          "replay" -> {
                              try {
                                  mediaPlayer?.seekTo(0)
                                  mediaPlayer?.start()
                              } catch (_: Exception) {}
                              result.success(true)
                          }
                          "stop" -> {
                              stopPlayback()
                              result.success(true)
                          }
                          "setVoiceMode" -> {
                              val mode = call.argument<String>("mode") ?: "STEREO"
                              applyVoiceMode(mode)
                              result.success(currentVoiceMode)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun notifyDisplayStatus(isConnected: Boolean) {
                  runOnUiThread {
                      methodChannel?.invokeMethod("onDisplayChanged", isConnected)
                  }
              }

              private fun setupSecondaryDisplay(): Boolean {
                  val displays = displayManager?.getDisplays(DisplayManager.DISPLAY_CATEGORY_PRESENTATION)
                  if (!displays.isNullOrEmpty()) {
                      val tvDisplay = displays[0]
                      if (presentation == null || presentation?.display?.displayId != tvDisplay.displayId) {
                          presentation?.dismiss()
                          presentation = KaraokePresentation(this, tvDisplay)
                          presentation?.show()
                      }
                      attachActiveSurface()
                      notifyDisplayStatus(true)
                      return true
                  }
                  attachActiveSurface()
                  notifyDisplayStatus(false)
                  return false
              }

              private fun attachActiveSurface() {
                  val mp = mediaPlayer ?: return
                  try {
                      val tvHolder = presentation?.surfaceView?.holder
                      if (tvHolder != null && tvHolder.surface.isValid) {
                          mp.setDisplay(tvHolder)
                          return
                      }
                      val localHolder = localSurfaceHolder
                      if (localHolder != null && localHolder.surface.isValid) {
                          mp.setDisplay(localHolder)
                          return
                      }
                      mp.setDisplay(null)
                  } catch (_: Exception) {}
              }

              private fun playVideo(filePath: String) {
                  setupSecondaryDisplay()
                  val file = File(filePath)
                  if (!file.exists()) return

                  try {
                      mediaPlayer?.release()
                      mediaPlayer = MediaPlayer().apply {
                          setDataSource(filePath)
                          setOnPreparedListener { mp ->
                              attachActiveSurface()
                              applyVoiceMode(currentVoiceMode)
                              mp.start()
                          }
                          setOnCompletionListener {
                              runOnUiThread {
                                  methodChannel?.invokeMethod("onSongCompleted", null)
                              }
                          }
                          prepareAsync()
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun togglePauseResume(): Boolean {
                  val mp = mediaPlayer ?: return false
                  return try {
                      if (mp.isPlaying) {
                          mp.pause()
                          false
                      } else {
                          mp.start()
                          true
                      }
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun stopPlayback() {
                  try {
                      mediaPlayer?.stop()
                      mediaPlayer?.release()
                      mediaPlayer = null
                  } catch (_: Exception) {}
              }

              private fun applyVoiceMode(mode: String) {
                  currentVoiceMode = mode
                  val mp = mediaPlayer ?: return
                  try {
                      val tracks = mp.trackInfo
                      val audioTracks = mutableListOf<Int>()
                      for (i in tracks.indices) {
                          if (tracks[i].trackType == MediaPlayer.TrackInfo.MEDIA_TRACK_TYPE_AUDIO) {
                              audioTracks.add(i)
                          }
                      }
                      when (mode) {
                          "STEREO" -> {
                              if (audioTracks.isNotEmpty()) mp.selectTrack(audioTracks[0])
                              mp.setVolume(1.0f, 1.0f)
                          }
                          "LEFT" -> {
                              if (audioTracks.isNotEmpty()) mp.selectTrack(audioTracks[0])
                              mp.setVolume(1.0f, 0.0f)
                          }
                          "RIGHT" -> {
                              if (audioTracks.isNotEmpty()) mp.selectTrack(audioTracks[0])
                              mp.setVolume(0.0f, 1.0f)
                          }
                          "TRACK2" -> {
                              if (audioTracks.size > 1) {
                                  mp.selectTrack(audioTracks[1])
                              } else if (audioTracks.isNotEmpty()) {
                                  mp.selectTrack(audioTracks[0])
                              }
                              mp.setVolume(1.0f, 1.0f)
                          }
                      }
                  } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  displayManager?.unregisterDisplayListener(displayListener)
                  stopPlayback()
                  presentation?.dismiss()
                  super.onDestroy()
              }

              inner class LocalVideoView(context: Context) : PlatformView {
                  private val surfaceView = SurfaceView(context)

                  init {
                      surfaceView.holder.addCallback(object : SurfaceHolder.Callback {
                          override fun surfaceCreated(holder: SurfaceHolder) {
                              localSurfaceHolder = holder
                              attachActiveSurface()
                          }
                          override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}
                          override fun surfaceDestroyed(holder: SurfaceHolder) {
                              if (localSurfaceHolder == holder) {
                                  localSurfaceHolder = null
                              }
                              attachActiveSurface()
                          }
                      })
                  }

                  override fun getView(): View = surfaceView
                  override fun dispose() {}
              }

              inner class KaraokePresentation(context: Context, display: Display) : Presentation(context, display) {
                  lateinit var surfaceView: SurfaceView

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      val layout = FrameLayout(context).apply {
                          setBackgroundColor(Color.BLACK)
                      }
                      surfaceView = SurfaceView(context)
                      surfaceView.holder.addCallback(object : SurfaceHolder.Callback {
                          override fun surfaceCreated(holder: SurfaceHolder) {
                              attachActiveSurface()
                          }
                          override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}
                          override fun surfaceDestroyed(holder: SurfaceHolder) {
                              attachActiveSurface()
                          }
                      })
                      layout.addView(surfaceView, FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      ))
                      setContentView(layout)
                  }
              }
          }
          EOF

      - name: Write main.dart (NMH Remote Style UI + Background Excel Isolate + Tablet Video)
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:excel/excel.dart' as xls;
          import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:path/path.dart' as p;
          import 'package:permission_handler/permission_handler.dart';
          import 'package:sqflite/sqflite.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            runApp(const NMHKaraokeApp());
          }

          class NMHKaraokeApp extends StatelessWidget {
            const NMHKaraokeApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'NMH Karaoke',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0A0E1A),
                  primaryColor: const Color(0xFFFFB300),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFFFB300),
                    secondary: Color(0xFF00E5FF),
                  ),
                ),
                home: const KaraokeHomeScreen(),
              );
            }
          }

          class Song {
            final String code;
            final String title;
            final String artist;
            final String coArtist;
            final String album;
            final bool isDisco;

            Song({
              required this.code,
              required this.title,
              required this.artist,
              required this.coArtist,
              required this.album,
              this.isDisco = false,
            });

            Map<String, dynamic> toMap() => {
                  'code': code,
                  'title': title,
                  'artist': artist,
                  'coArtist': coArtist,
                  'album': album,
                  'isDisco': isDisco ? 1 : 0,
                };

            factory Song.fromMap(Map<String, dynamic> m) => Song(
                  code: m['code'] ?? '',
                  title: m['title'] ?? '',
                  artist: m['artist'] ?? '',
                  coArtist: m['coArtist'] ?? '',
                  album: m['album'] ?? '',
                  isDisco: (m['isDisco'] ?? 0) == 1,
                );
          }

          // Background Isolate parser so large Excel files never freeze the UI
          List<Map<String, dynamic>> parseExcelInIsolate(Map<String, dynamic> params) {
            final Uint8List bytes = params['bytes'];
            final bool isDisco = params['isDisco'];
            final excel = xls.Excel.decodeBytes(bytes);
            final List<Map<String, dynamic>> result = [];

            for (final table in excel.tables.keys) {
              final sheet = excel.tables[table];
              if (sheet == null) continue;
              for (int i = 1; i < sheet.rows.length; i++) {
                final row = sheet.rows[i];
                if (row.isEmpty) continue;
                String cell(int idx) {
                  if (idx >= row.length || row[idx] == null || row[idx]?.value == null) return '';
                  return row[idx]!.value.toString().trim();
                }
                final code = cell(0);
                final title = cell(1);
                if (code.isNotEmpty && title.isNotEmpty) {
                  result.add({
                    'code': code,
                    'title': title,
                    'artist': cell(2),
                    'coArtist': cell(3),
                    'album': cell(4),
                    'isDisco': isDisco ? 1 : 0,
                  });
                }
              }
            }
            return result;
          }

          class DatabaseHelper {
            static Database? _db;

            static Future<Database> get database async {
              if (_db != null) return _db!;
              final dbPath = await getDatabasesPath();
              _db = await openDatabase(
                p.join(dbPath, 'nmh_karaoke_v2.db'),
                version: 1,
                onCreate: (db, v) async {
                  await db.execute('''
                    CREATE TABLE songs(
                      code TEXT PRIMARY KEY,
                      title TEXT,
                      artist TEXT,
                      coArtist TEXT,
                      album TEXT,
                      isDisco INTEGER
                    )
                  ''');
                  await db.execute('CREATE INDEX idx_title ON songs(title)');
                  await db.execute('CREATE INDEX idx_artist ON songs(artist)');
                  await db.execute('CREATE INDEX idx_album ON songs(album)');
                },
              );
              return _db!;
            }

            static Future<void> replaceAllSongs(List<Map<String, dynamic>> maps) async {
              final db = await database;
              await db.transaction((txn) async {
                await txn.delete('songs');
                final batch = txn.batch();
                for (final m in maps) {
                  batch.insert('songs', m, conflictAlgorithm: ConflictAlgorithm.replace);
                }
                await batch.commit(noResult: true);
              });
            }

            static Future<int> getSongCount() async {
              final db = await database;
              final res = await db.rawQuery('SELECT COUNT(*) FROM songs');
              return Sqflite.firstIntValue(res) ?? 0;
            }

            static Future<List<Song>> searchSongs({
              String query = '',
              String category = 'TITLE',
              String? exactGroup,
            }) async {
              final db = await database;
              final q = '%${query.trim()}%';
              List<Map<String, dynamic>> maps;

              if (exactGroup != null && exactGroup.isNotEmpty) {
                if (category == 'ARTIST') {
                  maps = await db.query(
                    'songs',
                    where: '(artist = ? OR coArtist = ?) AND (title LIKE ? OR code LIKE ?)',
                    whereArgs: [exactGroup, exactGroup, q, q],
                    limit: 300,
                  );
                } else {
                  maps = await db.query(
                    'songs',
                    where: 'album = ? AND (title LIKE ? OR code LIKE ?)',
                    whereArgs: [exactGroup, q, q],
                    limit: 300,
                  );
                }
              } else if (category == 'DISCO') {
                maps = query.trim().isEmpty
                    ? await db.query('songs', where: 'isDisco = 1', limit: 250)
                    : await db.query('songs',
                        where: 'isDisco = 1 AND (title LIKE ? OR artist LIKE ? OR code LIKE ?)',
                        whereArgs: [q, q, q],
                        limit: 250);
              } else if (category == 'CODE') {
                maps = await db.query('songs',
                    where: 'code LIKE ?', whereArgs: ['${query.trim()}%'], limit: 150);
              } else if (category == 'ARTIST') {
                maps = await db.query('songs',
                    where: 'artist LIKE ? OR coArtist LIKE ?', whereArgs: [q, q], limit: 250);
              } else if (category == 'ALBUM') {
                maps = await db.query('songs', where: 'album LIKE ?', whereArgs: [q], limit: 250);
              } else {
                maps = await db.query('songs',
                    where: 'title LIKE ? OR artist LIKE ? OR code LIKE ?',
                    whereArgs: [q, q, q],
                    limit: 250);
              }
              return maps.map((m) => Song.fromMap(m)).toList();
            }

            static Future<List<String>> getDistinctGroups(String col, String filter) async {
              final db = await database;
              final res = await db.query(
                'songs',
                distinct: true,
                columns: [col],
                where: filter.trim().isEmpty ? '$col != ""' : '$col LIKE ?',
                whereArgs: filter.trim().isEmpty ? null : ['%${filter.trim()}%'],
                orderBy: '$col ASC',
                limit: 300,
              );
              return res.map((e) => e[col].toString()).where((s) => s.isNotEmpty).toList();
            }
          }

          class KaraokeHomeScreen extends StatefulWidget {
            const KaraokeHomeScreen({super.key});

            @override
            State<KaraokeHomeScreen> createState() => _KaraokeHomeScreenState();
          }

          class _KaraokeHomeScreenState extends State<KaraokeHomeScreen> {
            static const platform = MethodChannel('com.nmh.karaoke/player');

            final List<Song> _queue = [];
            final List<Song> _history = [];
            Song? _currentSong;
            bool _isTvConnected = false;
            bool _isPlaying = false;
            bool _isSyncing = false;
            bool _isTabletFullscreen = false;
            String _voiceMode = 'STEREO';
            String _activeView = 'HOME';
            String? _selectedGroup;
            int _totalSongs = 0;

            final TextEditingController _searchController = TextEditingController();
            List<Song> _searchResults = [];
            List<String> _groupResults = [];

            @override
            void initState() {
              super.initState();
              platform.setMethodCallHandler((call) async {
                if (call.method == 'onDisplayChanged') {
                  if (mounted) {
                    setState(() {
                      _isTvConnected = call.arguments == true;
                      if (_isTvConnected) _isTabletFullscreen = false;
                    });
                  }
                } else if (call.method == 'onSongCompleted') {
                  _playNextSong();
                }
              });
              _initApp();
            }

            Future<void> _initApp() async {
              try {
                await Permission.storage.request();
                await Permission.manageExternalStorage.request();
              } catch (_) {}

              try {
                final bool connected = await platform.invokeMethod('checkDisplay');
                if (mounted) setState(() => _isTvConnected = connected);
              } catch (_) {}

              final count = await DatabaseHelper.getSongCount();
              if (mounted) setState(() => _totalSongs = count);
              if (count == 0) {
                Future.delayed(const Duration(milliseconds: 500), _syncExcelData);
              }
            }

            Future<List<Directory>> _discoverStorageRoots() async {
              final List<Directory> roots = [];
              for (final path in [
                '/storage/emulated/0',
                '/storage/emulated/0/NMH_Karaoke',
                '/storage/sdcard1',
                '/storage/sdcard1/NMH_Karaoke',
              ]) {
                final d = Directory(path);
                if (await d.exists()) roots.add(d);
              }
              try {
                final storageDir = Directory('/storage');
                if (await storageDir.exists()) {
                  await for (final entity in storageDir.list()) {
                    if (entity is Directory &&
                        !entity.path.contains('emulated') &&
                        !entity.path.contains('self')) {
                      roots.add(entity);
                      final sub = Directory('${entity.path}/NMH_Karaoke');
                      if (await sub.exists()) roots.add(sub);
                    }
                  }
                }
              } catch (_) {}
              return roots;
            }

            Future<void> _syncExcelData() async {
              if (_isSyncing) return;
              setState(() => _isSyncing = true);
              try {
                final roots = await _discoverStorageRoots();
                final List<Map<String, dynamic>> allMaps = [];

                for (final r in roots) {
                  final q2 = File(p.join(r.path, 'q2.xlsx'));
                  if (await q2.exists()) {
                    final bytes = await q2.readAsBytes();
                    final parsed = await compute(parseExcelInIsolate, {'bytes': bytes, 'isDisco': false});
                    allMaps.addAll(parsed);
                  }
                  final disco = File(p.join(r.path, 'disco.xlsx'));
                  if (await disco.exists()) {
                    final bytes = await disco.readAsBytes();
                    final parsed = await compute(parseExcelInIsolate, {'bytes': bytes, 'isDisco': true});
                    allMaps.addAll(parsed);
                  }
                }

                if (allMaps.isNotEmpty) {
                  await DatabaseHelper.replaceAllSongs(allMaps);
                  final count = await DatabaseHelper.getSongCount();
                  if (mounted) setState(() => _totalSongs = count);
                  _showSnack('သီချင်းပေါင်း $count ပုဒ် ဖတ်သွင်းပြီးပါပြီ။');
                } else {
                  _showSnack('q2.xlsx / disco.xlsx ဖိုင် မတွေ့ပါ (Storage အပြင်ဆုံးတွင် ထည့်ပါ)။');
                }
              } catch (e) {
                _showSnack('Excel ဖတ်ရာတွင် အမှားဖြစ်ပါသည်: $e');
              } finally {
                if (mounted) setState(() => _isSyncing = false);
              }
            }

            Future<String?> _findVideoPath(String code) async {
              final roots = await _discoverStorageRoots();
              for (final r in roots) {
                for (final folder in ['Myanmar_songs', 'Myanmar_New_Songs', 'DiscoVideo', '']) {
                  final dir = folder.isEmpty ? r.path : p.join(r.path, folder);
                  for (final ext in ['.mp4', '.mkv', '.dat', '.mpg', '.avi', '.MP4', '.MKV', '.DAT', '.MPG']) {
                    final file = File(p.join(dir, '$code$ext'));
                    if (await file.exists()) return file.path;
                  }
                }
              }
              return null;
            }

            Future<void> _addToQueue(Song song, {bool playNow = false}) async {
              if (playNow) {
                await _startPlayingSong(song);
                return;
              }
              setState(() => _queue.add(song));
              _showSnack('တန်းစီပြီး: ${song.title} (${song.code})');
              if (_currentSong == null) {
                _playNextSong();
              }
            }

            Future<void> _startPlayingSong(Song song) async {
              final path = await _findVideoPath(song.code);
              if (path == null) {
                _showSnack('ဗီဒီယိုဖိုင် (${song.code}) ကို Myanmar_songs / Myanmar_New_Songs / DiscoVideo ထဲတွင် မတွေ့ပါ။');
                return;
              }
              setState(() {
                _currentSong = song;
                _isPlaying = true;
                _history.removeWhere((s) => s.code == song.code);
                _history.insert(0, song);
              });
              try {
                await platform.invokeMethod('playVideo', {'path': path});
              } catch (e) {
                _showSnack('ဗီဒီယိုဖွင့်ရာတွင် အမှားဖြစ်ပါသည်: $e');
              }
            }

            Future<void> _playNextSong() async {
              if (_queue.isEmpty) {
                setState(() {
                  _currentSong = null;
                  _isPlaying = false;
                  _isTabletFullscreen = false;
                });
                await platform.invokeMethod('stop');
                return;
              }
              final next = _queue.removeAt(0);
              setState(() {});
              await _startPlayingSong(next);
            }

            Future<void> _cycleVoiceMode() async {
              const modes = ['STEREO', 'LEFT', 'RIGHT', 'TRACK2'];
              final nextMode = modes[(modes.indexOf(_voiceMode) + 1) % modes.length];
              await platform.invokeMethod('setVoiceMode', {'mode': nextMode});
              setState(() => _voiceMode = nextMode);
            }

            void _showSnack(String msg) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).hideCurrentSnackBar();
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(msg, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  backgroundColor: const Color(0xFF1E293B),
                  duration: const Duration(seconds: 2),
                ),
              );
            }

            void _openCategory(String cat) async {
              _searchController.clear();
              setState(() {
                _activeView = cat;
                _selectedGroup = null;
                _searchResults = [];
                _groupResults = [];
              });

              if (cat == 'HISTORY') {
                setState(() => _searchResults = List.from(_history));
              } else if (cat == 'ARTIST') {
                final l = await DatabaseHelper.getDistinctGroups('artist', '');
                setState(() => _groupResults = l);
              } else if (cat == 'ALBUM') {
                final l = await DatabaseHelper.getDistinctGroups('album', '');
                setState(() => _groupResults = l);
              } else {
                final l = await DatabaseHelper.searchSongs(query: '', category: cat);
                setState(() => _searchResults = l);
              }
            }

            void _onSearchChanged(String val) async {
              if (_activeView == 'HISTORY') {
                setState(() {
                  _searchResults = _history
                      .where((s) => s.title.toLowerCase().contains(val.toLowerCase()) || s.code.contains(val))
                      .toList();
                });
                return;
              }
              if (_activeView == 'ARTIST' && _selectedGroup == null) {
                final l = await DatabaseHelper.getDistinctGroups('artist', val);
                setState(() => _groupResults = l);
              } else if (_activeView == 'ALBUM' && _selectedGroup == null) {
                final l = await DatabaseHelper.getDistinctGroups('album', val);
                setState(() => _groupResults = l);
              } else {
                final l = await DatabaseHelper.searchSongs(
                  query: val,
                  category: _activeView,
                  exactGroup: _selectedGroup,
                );
                setState(() => _searchResults = l);
              }
            }

